<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` is deliberate ONLY inside the exam runner and is set
         there in code. Here the page must stay zoomable: refusing zoom on a
         sign-in screen is an accessibility failure with no upside. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Declared, so the browser stops asking for /favicon.ico and getting a
         404 through Caddy on every cold load. SVG rather than .ico: one file,
         sharp at every size, and it is 300 bytes. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>IELTS Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
