name: CI

# Every push, because this repository has no pull-request habit yet — work goes
# straight to a branch, and a gate that only fires on PRs would never fire.
#
# A branch that also has an open PR runs twice. That is ~6 extra minutes on a
# 2,000-minute free allowance for a repository with one committer, and the fix
# when it stops being true is one line: narrow `push` to `[main]`.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. Nothing is learned by finishing a run
# against a commit that is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub sets CI=true already; stated here so the mechanism is visible from
  # the file that depends on it. It makes `tests/conftest.py` turn every skip
  # into a failure — see docs/design/0011-ci.md section 2.
  CI: 'true'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ---------------------------------------------------------------------------
  # No services, so it starts instantly and reports the cheap failures first.
  # A lint error should not wait three minutes behind a PostgreSQL container.
  checks:
    name: lint, contracts, spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor `pyproject.toml` declares. It had never actually been
          # tested — development happened on 3.11, so `requires-python = ">=3.12"`
          # was an assertion nothing checked.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: make install

      # Each on its own step so the failing gate is the step name in the UI,
      # not a line to find in a combined log.
      - name: Lint
        run: make lint

      - name: Module boundaries
        run: make contracts

      - name: Types (app/platform)
        run: make types

      - name: OpenAPI contract and route coverage
        run: make spec

      - name: Every admin endpoint has a screen
        # `make ci` has run this since it was written and this file never did,
        # so the console-coverage gate guarded nothing in CI for as long as it
        # existed. See the parity step below, which is why that is now hard.
        run: make console

      - name: The build definition can actually build
        # Cheap: three text files, no daemon, no image. Nothing here builds one —
        # this job cannot, and §12 of the CI doc argues the eleven minutes are
        # not worth spending — so the Dockerfile was the one artefact with no
        # gate at all, and it had three defects that stopped `docker compose up`
        # dead. A missing `target:` (every app service built the Caddy stage), a
        # stage-scoped ARG interpolated into a FROM (the file did not parse), and
        # a COPY of a path .dockerignore excluded. All three are ABSENCES, which
        # is why reading the file carefully found none of them.
        run: make build-def

      - name: No filename differs from another only by case
        # This runner is Linux and cannot reproduce what it is checking, which is
        # the point. `Exposure.tsx` and `exposure.ts` sat in one directory: fine
        # here and on every deploy, and on Windows or macOS the extensionless
        # import resolves to the WRONG file, because `.ts` is tried before `.tsx`
        # and the filesystem does not distinguish them. Two screens gone and the
        # console would not start — on the owner's own laptop, never in CI.
        run: make case

      - name: Every route reads the path parameters it declares
        # `/internal/storage/{bucket}/{key}` took a bucket and served every
        # request from the CONFIGURED one, while the delivery endpoint resolved
        # the same way over rows that each record their own bucket. An object
        # stored anywhere else streamed zero bytes behind a correct
        # Content-Length — a truncated 200 to the client, a protocol error in
        # the log, and no name for the failure anywhere.
        run: make path-params

      - name: CI runs every gate `make ci` runs
        # The check that keeps the three steps around it honest. `write-paths`
        # was added to `ci-tests` in the same commit that introduced it and CI
        # never ran it once — green, present, guarding nothing.
        run: make ci-parity

      - name: Unit tests (no database)
        run: make test-unit

  # ---------------------------------------------------------------------------
  # The admin console. Its own job because it needs Node and nothing else — no
  # database, no ffmpeg — so it reports in under a minute alongside the slow one.
  web:
    name: admin console (typecheck, codegen drift, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make web-install

      - name: The generated client matches the contract
        # The reason the frontend lives in this repository. `make spec` proves
        # the contract matches the running application; this proves the committed
        # client matches the contract. Together a schema change is a compile
        # error in the same run rather than an undefined in front of a teacher.
        run: make web-codegen-check

      - name: Unit tests
        # `ordering.ts` above all. `tests_authoring.py` once carried a section
        # move that 500'd one way and left a hole in the sequence the other, and
        # a hole is a student who cannot enter the next section of a timed exam.
        run: make web-test

      - name: Lint
        # In `ci-checks` since the commit that gave eslint a config, and in no
        # workflow step until the parity gate said so.
        run: make web-lint

      - name: Typecheck and build
        run: cd web && npm run build

  # ---------------------------------------------------------------------------
  tests:
    name: tests, migrations, invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # 16 because that is what the ADR commits production to. Testing against
        # a different major version tests a database we do not run.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Mapped to 6380 ON PURPOSE. `dramatiq.get_broker()` invents a
        # RedisBroker on localhost:6379 when none is installed, so a Redis on the
        # default port would let a misbound build pass the smoke test — verified,
        # it does. The smoke test asserts against the configured Redis directly
        # so it no longer depends on this, but leaving 6379 free means a
        # misbinding fails twice rather than once.
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The default `postgres` role in this image is superuser, which the suite
      # needs for two things: CREATE DATABASE (a scratch database per session,
      # plus the migrated template), and SET session_replication_role, without
      # which the per-test reset cannot clear the append-only tables.
      # scripts/README.md section 5 states both.
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6380/15
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Start MinIO
        # A step rather than a `services:` entry, because a service container
        # runs the image's default command and `minio/minio` needs `server
        # /data` — which `services:` gives no way to supply. Started here, health
        # -checked here, so a failure names itself instead of surfacing as 29
        # connection errors later.
        #
        # Pinned, and it was `:latest` — the only unbounded reference in this
        # file. `postgres:16` and `redis:7-alpine` float WITHIN a major on
        # purpose: the ADR commits production to PostgreSQL 16, and patch
        # releases inside it are what you want. `:latest` has no such bound. It
        # would move MinIO across major versions overnight, so a green branch
        # could go red on a commit that changed nothing, and the author would
        # have no reason to suspect the CI file.
        #
        # Tag AND digest: the tag says what it is to a human, the digest is what
        # Docker actually resolves. To bump, pick a newer RELEASE tag and get its
        # index digest:
        #   TOKEN=$(curl -sS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:minio/minio:pull" | jq -r .token)
        #   curl -sSI -H "Authorization: Bearer $TOKEN" \
        #     -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
        #     https://registry-1.docker.io/v2/minio/minio/manifests/<TAG> | grep -i docker-content-digest
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 40); do
            if curl -fsS --noproxy '*' http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio ready"; exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready"; docker logs minio; exit 1

      - name: Install ffmpeg
        # The transcode worker shells out to it (ADR-0001 section 5.5). Without
        # it the ten ingest tests would skip, and a skip is a failure here — so
        # this step missing does not quietly reduce coverage, it fails the run.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - run: make install

      - name: Prove the environment
        # Cheap, and it turns "a test failed strangely" into "psql is 15, not 16"
        # without a bisect.
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version_info[:2] >= (3, 12), sys.version"
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python - <<'PY'
          import os
          import redis
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["TEST_DATABASE_URL"]).connect() as c:
              print(c.scalar(text("select version()")))
              assert c.scalar(text("select usesuper from pg_user where usename = current_user")), \
                  "the CI role is not superuser; the per-test reset cannot clear audit_log"
          r = redis.Redis.from_url(os.environ["REDIS_URL"])
          assert r.ping()
          print("redis", r.info()["redis_version"], "on", os.environ["REDIS_URL"])
          import boto3
          s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT"],
                            region_name=os.environ["S3_REGION"],
                            aws_access_key_id=os.environ["S3_ACCESS_KEY"],
                            aws_secret_access_key=os.environ["S3_SECRET_KEY"])
          s3.list_buckets()
          print("s3 reachable at", os.environ["S3_ENDPOINT"])
          PY

      - name: Test suite and coverage floors
        # `make coverage` is `test-fast` plus the per-path floors. There is no
        # repository-wide percentage target — see docs/design/0011-ci.md section
        # 10 for why that is deliberate.
        run: make coverage

      - name: Migrations apply, reverse, and re-apply
        run: make migrations

      - name: Database-enforced invariants and the zero-DDL acceptance test
        run: make invariants

      - name: Every filtered column has a writer
        # The reverse of `check_schema_conformance.py`: a predicate on a column
        # no code path can change always answers the same way. Needs the live
        # schema, which is why it is in this job rather than with the cheap
        # gates. Eleven defects of that shape have been found by it so far.
        run: make write-paths

      - name: Workers boot and run a job (real Redis, real worker process)
        # The only step that starts a second OS process. Every actor test in the
        # suite calls the functions directly, so none of them can see an actor
        # bound to the wrong broker — the failure that actually happened, whose
        # only symptom is a queue that stays empty.
        run: make smoke
