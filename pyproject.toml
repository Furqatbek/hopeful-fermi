[project]
name = "ielts-hub"
version = "0.1.0"
description = "IELTS preparation hub — modular monolith backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
    "structlog>=24.4",
    "boto3>=1.35",
    "jsonschema>=4.23",
    "python-docx>=1.1",
    "uuid6>=2024.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    # Parallel test execution. Only viable because the template database makes a
    # per-worker scratch database cost ~0.4 s instead of a 5.4 s migration run.
    "pytest-xdist>=3.6",
    "import-linter>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["app"]

# The mechanism that makes "modular monolith" a fact rather than an aspiration
# (ADR-0001 section 4.3). These contracts fail the build, not a code review.

[[tool.importlinter.contracts]]
name = "Modules never reach into another module's internals"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "Layered dependencies: platform is the floor, nothing depends upward"
type = "layers"
layers = ["app.api", "app.modules", "app.platform"]

[[tool.importlinter.contracts]]
name = "Workers are a composition root, layered the same way"
type = "layers"
layers = ["app.workers", "app.modules", "app.platform"]

[[tool.importlinter.contracts]]
name = "The two composition roots are independent"
type = "forbidden"
# Written as `forbidden` rather than as sibling layers on purpose: the
# `["app.api : app.workers", ...]` sibling syntax reports KEPT against a real
# violation on import-linter 2.13, and a contract that passes while the rule is
# broken is worse than no contract. Verified to fire.
source_modules = ["app.workers"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "The API never reaches into the worker pool"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.workers"]

[[tool.importlinter.contracts]]
name = "qtypes depends on the platform kernel only"
type = "forbidden"
source_modules = ["app.modules.qtypes"]
forbidden_modules = [
    "app.modules.content",
    "app.modules.exam",
    "app.modules.billing",
    "app.modules.identity",
    "app.modules.safety",
]

[[tool.importlinter.contracts]]
name = "analytics reads nothing at runtime; it owns its read models"
type = "forbidden"
source_modules = ["app.modules.analytics"]
forbidden_modules = [
    "app.modules.content",
    "app.modules.exam",
    "app.modules.billing",
    "app.modules.identity",
]

[[tool.importlinter.contracts]]
name = "billing does not depend on content or exam"
type = "forbidden"
source_modules = ["app.modules.billing"]
forbidden_modules = ["app.modules.content", "app.modules.exam", "app.modules.qtypes"]
