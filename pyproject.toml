# `pip install -e .` had never been run. Without a build backend and an explicit
# package list, setuptools auto-discovery sees `app`, `tests`, `migrations`,
# `scripts`, `registry` and `openapi` as six candidate top-level packages and
# refuses to guess — so the install failed outright. Everything worked only
# because `python3 -m pytest` from the repo root puts the root on `sys.path`.
# CI's first step is an install, which is how this surfaced.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `app` is the distribution. The rest of the repo is the repository, not the
# package: migrations run from a checkout, tests are not shipped, and `registry/`
# and `openapi/` are read from the source tree by path — which keeps working
# under an editable install, and is the reason the install stays editable.
[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "ielts-hub"
version = "0.1.0"
description = "IELTS preparation hub — modular monolith backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
    "structlog>=24.4",
    "boto3>=1.35",
    "jsonschema>=4.23",
    "python-docx>=1.1",
    "uuid6>=2024.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.20",
    # AES-GCM for the synchronized-start competition lobby
    # (`api/routers/competitions.py`). It was never declared and only ever
    # worked because something else pulled it in transitively — on a clean
    # install the lobby endpoint returns 500. Found by installing into an empty
    # environment, which is what CI does and what nothing did before.
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Parallel test execution. Only viable because the template database makes a
    # per-worker scratch database cost ~0.4 s instead of a 5.4 s migration run.
    "pytest-xdist>=3.6",
    "import-linter>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    # `scripts/validate_openapi.py` and `check_api_coverage.py` import these and
    # they were never declared — scripts/README.md told the reader to pip install
    # them by hand. Both are CI gates now, so they are dependencies.
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pinned explicitly, because ruff's DEFAULT rule set changes between releases and
# an unpinned gate means the build's meaning depends on which ruff a runner
# happened to install. Proven: this repository was clean under 0.15's defaults
# and reported 441 findings under 0.16's, 325 of them `B008` — which flags
# `Depends()` in a parameter default, i.e. every FastAPI handler ever written.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: the subset that is not style opinion
    "F",               # pyflakes
    "W",               # trailing whitespace, missing final newline
    "B",               # flake8-bugbear
]

# `B008` is a false positive for this framework by construction: FastAPI's whole
# dependency-injection mechanism is a function call in a parameter default.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo'd mark silently does nothing, which for a `skipif` means a test that
# quietly stops running. Cheap to turn into an error now that CI is the reader.
addopts = "--strict-markers --strict-config"

# A run emitted 4,944 warnings and CI read none of them. That is not noise to
# turn down, it is a channel nobody was listening on: four distinct warnings were
# in there and three were worth acting on.
#
#   * PyJWT, ~4,900 times: "the HMAC key is 18 bytes". That was `jwt_secret`
#     still holding the default committed to `platform/config.py` — the key that
#     signs every access token, derives every media grant and every competition
#     payload key. It now fails closed outside development.
#   * Starlette, twice: `HTTP_413_REQUEST_ENTITY_TOO_LARGE` and
#     `HTTP_416_REQUESTED_RANGE_NOT_SATISFIABLE` are renamed. Both were written
#     into `object_storage.py` days earlier and the warning arrived the same day.
#
# So: error by default. Every exemption below is a specific message from a
# specific module, never a bare category, and carries its reason — an ignore
# without one is a line somebody appends to during a bad afternoon.
filterwarnings = [
    "error",
    # Upstream, and about the test client rather than the product: Starlette
    # wants `httpx2`. Swapping the HTTP client under 1,940 passing tests is its
    # own change with its own risk, and it buys nothing today.
    #
    # `StarletteDeprecationWarning` derives from `UserWarning`, not from
    # `DeprecationWarning` — naming the obvious category matches nothing and
    # leaves the ignore silently inert, which is the same failure mode as the
    # unread warnings this section exists to fix.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.mypy]
python_version = "3.12"
# Gated on `app/platform` only, which is clean today. The rest is 99 errors, and
# introducing a type checker across a finished codebase is its own piece of work,
# not something to bolt onto turning CI on. docs/design/0011-ci.md section 5 has
# the count per package and the order to ratchet it outward in.
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["app"]

# The mechanism that makes "modular monolith" a fact rather than an aspiration
# (ADR-0001 section 4.3). These contracts fail the build, not a code review.

[[tool.importlinter.contracts]]
name = "Modules never reach into another module's internals"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "Layered dependencies: platform is the floor, nothing depends upward"
type = "layers"
layers = ["app.api", "app.modules", "app.platform"]

[[tool.importlinter.contracts]]
name = "Workers are a composition root, layered the same way"
type = "layers"
layers = ["app.workers", "app.modules", "app.platform"]

[[tool.importlinter.contracts]]
name = "The two composition roots are independent"
type = "forbidden"
# Written as `forbidden` rather than as sibling layers on purpose: the
# `["app.api : app.workers", ...]` sibling syntax reports KEPT against a real
# violation on import-linter 2.13, and a contract that passes while the rule is
# broken is worse than no contract. Verified to fire.
source_modules = ["app.workers"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "The API never reaches into the worker pool"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.workers"]

[[tool.importlinter.contracts]]
name = "qtypes depends on the platform kernel only"
type = "forbidden"
source_modules = ["app.modules.qtypes"]
forbidden_modules = [
    "app.modules.content",
    "app.modules.exam",
    "app.modules.billing",
    "app.modules.identity",
    "app.modules.safety",
]

[[tool.importlinter.contracts]]
name = "analytics reads nothing at runtime; it owns its read models"
type = "forbidden"
source_modules = ["app.modules.analytics"]
forbidden_modules = [
    "app.modules.content",
    "app.modules.exam",
    "app.modules.billing",
    "app.modules.identity",
]

[[tool.importlinter.contracts]]
name = "billing does not depend on content or exam"
type = "forbidden"
source_modules = ["app.modules.billing"]
forbidden_modules = ["app.modules.content", "app.modules.exam", "app.modules.qtypes"]
