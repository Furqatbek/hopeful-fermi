[project]
name = "ielts-hub"
version = "0.1.0"
description = "IELTS preparation hub — modular monolith backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
    "structlog>=24.4",
    "boto3>=1.35",
    "jsonschema>=4.23",
    "python-docx>=1.1",
    "uuid6>=2024.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
